version: '3.9'

services:
  mysql:
    image: mysql:8.0          # Use MySQL 8.0 (you can change the version if needed)
    container_name: mysql_db  # Optional: name of the container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass   # root user password
      MYSQL_DATABASE: mydb            # database created at startup
      MYSQL_USER: myuser              # optional non-root user
      MYSQL_PASSWORD: mypass          # password for that user
    ports:
      - "3306:3306"                   # expose MySQL port to host
    volumes:
      - mysql_data:/var/lib/mysql     # persist data locally

volumes:
  mysql_data:
