[package]
name = "nanobase"
version = "0.1.0"
edition = "2021"
description = "PocketBase-style backend platform: apps, auth, storage and permissions on your own database."
license = "ISC"
repository = "https://github.com/kethan/mosql"
readme = "README.md"
keywords = ["backend", "baas", "database", "sqlite", "serverless"]
categories = ["database", "web-programming::http-server"]

[lib]
doctest = false
name = "nanobase"
path = "src/lib.rs"

[[bin]]
name = "nanobase"
path = "src/main.rs"

# No external dependencies on purpose: crates.io is unreachable in the build
# sandbox, and every dependency is binary size the platform does not need.
[dependencies]
mosql = { path = "../rust" }
uflite = { path = "../uflite" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
