[package]
name = "mosql-core"
version = "0.1.0"
edition = "2021"
description = "Serverless HTTP database drivers for SQLite, PostgreSQL and MySQL, from one connection URL. Zero dependencies beyond the repository's own JSON."
license = "ISC"
repository = "https://github.com/kethan/mosql"
readme = "README.md"
keywords = ["database", "serverless", "turso", "d1", "postgres", "mysql", "http"]
categories = ["database", "web-programming::http-client"]
# Ship only the library, its docs and the licence: the build products are
# not sources.
include = ["src/**", "README.md", "LICENSE*"]

# The JSON is the repository's own: `mosql` for the value model, the parser
# and the writer. Nothing is fetched from a registry, so the crate builds
# wherever Rust does — including a Worker, where a TLS stack would be a
# dependency nobody wants.
[dependencies]
mosql = { version = "0.1", path = "../rust", default-features = false }

[lib]
name = "mosql_core"
path = "src/lib.rs"
doctest = false

[features]
default = ["std"]
# The standard library. Off for a freestanding build, where the crate
# uses `alloc` and nothing else.
std = ["mosql/std"]
# A transport that posts through the system `curl`. This is the platform's
# own answer to "HTTPS without a registry": every server has `curl`, and
# it brings TLS.
transport-curl = []
# Reserved for a transport built on the `ureq` crate, with rustls. It is
# the one dependency that needs a registry, and this repository is built
# without one, so the feature is off by default and the implementation is
# not here: to use it, add
#
#   ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
#
# under `[dependencies]`, write the transport against `ureq::post`, and
# turn this feature on. The `transport-curl` transport covers the same
# ground without a registry, and the `transport-worker` transport covers
# a Worker.
transport-ureq = []
# A transport over a host-provided `fetch`: what a Cloudflare Worker
# offers (`worker::Fetch::Request`), and what any host that wants its
# own networking offers. The function is supplied by the caller, so the
# crate has no opinion about how the request is made.
transport-worker = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
